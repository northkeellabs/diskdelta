.tl-chart { width: 100%; min-height: 230px; }
.tl-svg { display: block; overflow: visible; }
.axis { font-size: 11px; fill: var(--text-3); font-variant-numeric: tabular-nums; }
.grid-line { stroke: var(--border); stroke-width: 1; }
.axis-line { stroke: var(--border-strong); stroke-width: 1; }
.bar { fill: var(--c-bar); }
.bar-hit { fill: transparent; }
.bar-g { cursor: pointer; outline: none; }
.bar-g:hover .bar-hit { fill: var(--hover); }
.bar-g.sel .bar { fill: var(--c-bar-sel); }
.bar-g.sel .bar-hit { fill: var(--accent-soft); }
.bar-g:focus-visible .bar-hit { stroke: var(--focus); stroke-width: 2; }
.tl-svg.draw .bar { transform-box: fill-box; transform-origin: 50% 100%; animation: bar-in 260ms cubic-bezier(0.2, 0, 0, 1) both; }
@keyframes bar-in { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.chart-note { margin: var(--sp-2) 0 0; font-size: var(--fs-xs); color: var(--text-3); }
.tl-day { margin-top: var(--sp-4); }
.day-head { margin: 0 0 var(--sp-2); font-size: var(--fs-md); font-weight: 600; font-variant-numeric: tabular-nums; }
.day-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border); }
.day-list li { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto auto; align-items: center; gap: var(--sp-3); padding: 7px 0; border-bottom: 1px solid var(--border); font-size: var(--fs-sm); }
.day-size { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.day-name { display: flex; flex-direction: column; min-width: 0; }
.day-title { font-weight: 500; }
.day-path { font-family: var(--mono); font-size: var(--fs-xs); color: var(--text-3); overflow-wrap: anywhere; }

/* sunburst */
.sun { display: grid; grid-template-columns: minmax(280px, 480px) minmax(260px, 1fr); gap: var(--sp-6); align-items: start; }
@media (max-width: 860px) { .sun { grid-template-columns: 1fr; } }
.sun-chart { min-width: 0; display: flex; justify-content: center; }
.sun-chart:has(table) { display: block; }
.sun-svg { display: block; overflow: visible; }
.arc { stroke: var(--surface); stroke-width: 1; cursor: pointer; transition: opacity 120ms ease-out; }
.arc.is-other { cursor: default; }
.arc.ring-2 { fill-opacity: 0.82; }
.arc.ring-3 { fill-opacity: 0.66; }
.arc:hover { opacity: 0.85; }
.arc:focus-visible { outline: none; stroke: var(--focus); stroke-width: 3; }
.sw-safe, path.sw-safe { fill: var(--c-safe); }
path.sw-check_first { fill: var(--c-check); }
path.sw-do_not_touch { fill: var(--c-dnt); }
path.sw-unknown { fill: var(--c-unknown); }
path.sw-personal { fill: var(--c-personal); }
path.sw-other { fill: var(--c-other); }
path.sw-container { fill: var(--c-container); }
.legend .sw-container::before, .sw-inline.sw-container::before { background: var(--c-container); }
.details-block.no-head { padding-top: 0; }
.details-block.no-head > details.exp:first-child { border-top: 0; }
.sun-center circle { fill: var(--surface-2); stroke: var(--border); }
.sun-center.can-up { cursor: pointer; }
.sun-center.can-up:hover circle { fill: var(--hover); }
.sun-center:focus-visible { outline: none; }
.sun-center:focus-visible circle { stroke: var(--focus); stroke-width: 2; }
.c-name { font-size: 14px; font-weight: 600; fill: var(--text); }
.c-size { font-size: 18px; font-weight: 700; fill: var(--text); font-variant-numeric: tabular-nums; }
.c-up { font-size: 11px; fill: var(--accent); font-weight: 600; letter-spacing: 0.02em; }
.sun-svg.draw, .sun-svg.drill-in, .sun-svg.drill-out { transform-origin: 50% 50%; }
.sun-svg.draw { animation: sun-draw 360ms cubic-bezier(0.2, 0, 0, 1) both; }
.sun-svg.drill-in { animation: sun-in 260ms cubic-bezier(0.2, 0, 0, 1) both; }
.sun-svg.drill-out { animation: sun-out 260ms cubic-bezier(0.2, 0, 0, 1) both; }
@keyframes sun-draw { from { opacity: 0; transform: scale(0.92) rotate(-12deg); } to { opacity: 1; transform: none; } }
@keyframes sun-in { from { opacity: 0.3; transform: scale(0.86); } to { opacity: 1; transform: none; } }
@keyframes sun-out { from { opacity: 0.3; transform: scale(1.12); } to { opacity: 1; transform: none; } }
.sun-panel { border-left: 1px solid var(--border); padding-left: var(--sp-5); min-width: 0; }
@media (max-width: 860px) { .sun-panel { border-left: 0; padding-left: 0; border-top: 1px solid var(--border); padding-top: var(--sp-4); } }
.panel-kicker { font-size: var(--fs-xs); font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--sp-1); }
.panel-title { margin: 0; font-size: var(--fs-xl); font-weight: 600; overflow-wrap: anywhere; }
.panel-path { font-family: var(--mono); font-size: var(--fs-xs); color: var(--text-3); overflow-wrap: anywhere; margin-top: 2px; }
.panel-size { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -0.02em; margin: var(--sp-3) 0 var(--sp-2); font-variant-numeric: tabular-nums; }
.panel-facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px var(--sp-4); margin: 0 0 var(--sp-3); font-size: var(--fs-sm); }
.panel-facts dt { color: var(--text-2); }
.panel-facts dd { margin: 0; }
.panel-facts .secondary { color: var(--text-3); }
.panel-label { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; }
.panel-label .tag { margin-left: 0; }
.panel-what { margin: var(--sp-3) 0; color: var(--text-2); font-size: var(--fs-sm); text-wrap: pretty; }
.panel-reclaim { margin-bottom: var(--sp-4); font-size: var(--fs-sm); }

/* legend swatches */
.legend span[class^="sw-"]::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend .sw-safe::before, .sw-inline.sw-safe::before { background: var(--c-safe); }
.legend .sw-check_first::before, .sw-inline.sw-check_first::before { background: var(--c-check); }
.legend .sw-do_not_touch::before, .sw-inline.sw-do_not_touch::before { background: var(--c-dnt); }
.legend .sw-unknown::before, .sw-inline.sw-unknown::before { background: var(--c-unknown); }
.legend .sw-personal::before, .sw-inline.sw-personal::before { background: var(--c-personal); }
.legend .sw-other::before, .sw-inline.sw-other::before { background: var(--c-other); border: 1px solid var(--border-strong); }
.legend .sw-safe { fill: none; }
.sw-inline::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* drives */
.drive-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--sp-4); margin-bottom: var(--sp-5); }
.drive { display: grid; grid-template-columns: auto 1fr; grid-template-rows: 1fr auto; gap: var(--sp-3) var(--sp-4); padding: var(--sp-5); background: var(--surface); border: 1px solid transparent; border-radius: var(--card-radius); box-shadow: var(--card-shadow); }
.drive.remote { box-shadow: 0 0 0 1px var(--border); background: var(--surface-2); }
.drive .ring { grid-row: 1 / span 2; }
.drive-info { min-width: 0; }
.drive-name { display: flex; align-items: baseline; gap: var(--sp-2); }
.drive-letter { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -0.02em; }
.drive-label { font-size: var(--fs-md); color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drive-type { font-size: var(--fs-xs); color: var(--text-3); margin-top: 2px; }
.drive-free { margin-top: var(--sp-3); font-variant-numeric: tabular-nums; }
.drive-free-num { font-size: var(--fs-xl); font-weight: 650; letter-spacing: -0.01em; }
.drive-used { font-size: var(--fs-sm); color: var(--text-2); font-variant-numeric: tabular-nums; margin-top: 2px; }
.drive-actions { display: flex; align-items: center; gap: var(--sp-2); }
.ring-track { fill: none; stroke: var(--bar-track); stroke-width: 9; }
.ring-fill { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; }
.ring-fill.full { stroke: var(--bar-full); }
.ring-pct { font-size: 18px; font-weight: 700; fill: var(--text); font-variant-numeric: tabular-nums; }
.ring.draw .ring-fill { animation: ring-in 380ms cubic-bezier(0.2, 0, 0, 1) both; }
@keyframes ring-in { from { stroke-dashoffset: var(--c); } }

/* details expanders */
.details-block { padding: var(--sp-5) 0 0; overflow: hidden; }
.details-block > .block-head { padding: 0 var(--sp-5); }
details.exp { border-top: 1px solid var(--border); }
details.exp > summary { display: flex; align-items: baseline; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5); cursor: pointer; list-style: none; }
details.exp > summary::-webkit-details-marker { display: none; }
details.exp > summary::before { content: ""; width: 0; height: 0; border-left: 5px solid var(--text-2); border-top: 4px solid transparent; border-bottom: 4px solid transparent; transform: translateY(-1px); transition: transform 120ms ease-out; }
details.exp[open] > summary::before { transform: translateY(-1px) rotate(90deg); }
details.exp > summary:hover { background: var(--hover); }
details.exp > summary:focus-visible { outline-offset: -2px; }
.exp-title { font-size: var(--fs-lg); font-weight: 600; }
.exp-sub { font-size: var(--fs-sm); color: var(--text-2); overflow-wrap: anywhere; }
.exp-body { padding: 0 var(--sp-5) var(--sp-5); }
.exp-body .section { box-shadow: none; }
.exp-note { margin: 0 0 var(--sp-3); color: var(--text-2); font-size: var(--fs-sm); max-width: 820px; text-wrap: pretty; }
h3.sub-title { font-size: var(--fs-xl); font-weight: 600; margin: var(--sp-2) 0 2px; }
.exp-body table.grid thead th { top: 52px; }

/* tooltip */
.tip { position: fixed; z-index: 50; max-width: 320px; padding: 8px 10px; background: var(--text); color: var(--surface); border-radius: 6px; font-size: var(--fs-xs); line-height: 1.45; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,0.18); font-variant-numeric: tabular-nums; }
.tip-title { font-weight: 600; font-size: var(--fs-sm); overflow-wrap: anywhere; }
.tip-line { opacity: 0.85; }

@media (prefers-reduced-motion: reduce) {
  .tl-svg.draw .bar, .sun-svg.draw, .sun-svg.drill-in, .sun-svg.drill-out, .ring.draw .ring-fill { animation: none !important; }
}
</style>

<header class="bar">
  <div class="brand">DiskDelta <span class="ver" id="ver"></span> <span class="badge hidden" id="demo-badge" title="Fictional PC, invented files">DEMO</span></div>
  <nav class="tabs" role="tablist" aria-label="Views" id="tabs">
    <button role="tab" id="tab-drives" aria-controls="view" aria-selected="true" data-view="drives">Drives</button>
    <button role="tab" id="tab-overview" aria-controls="view" aria-selected="false" data-view="overview" disabled>Overview</button>

  </nav>
  <div class="spacer"></div>
  <div class="controls">
    <label class="inline" for="root-select" id="root-label">Drive
      <select id="root-select" class="text"></select>
    </label>
    <span class="inline muted" id="days-label">Last</span>
    <div class="seg" role="group" aria-labelledby="days-label" id="days-seg">
      <button type="button" data-days="7" aria-pressed="false">7</button>
      <button type="button" data-days="30" aria-pressed="true">30</button>
      <button type="button" data-days="90" aria-pressed="false">90</button>
    </div>
    <label class="inline"><input class="text days" id="days-custom" type="number" min="1" max="365" step="1" aria-label="Custom number of days" placeholder="Custom"> days</label>
    <button class="btn" id="export-btn" type="button" disabled>Export report</button>
  </div>
</header>

<main id="view" role="tabpanel" aria-labelledby="tab-drives" tabindex="-1"></main>
<div id="tip" class="tip hidden" role="tooltip"></div>
<footer class="foot">DiskDelta is read-only: it never deletes, moves or changes anything on your drives. Free and open source, by Northkeel Labs (northkeellabs.com/diskdelta).</footer>

<dialog id="export-dialog" aria-labelledby="export-title">
  <div class="head" id="export-title">Export report</div>
  <div class="body">
    <div class="field"><span>Format</span>
      <div class="seg" role="group" aria-label="Format" id="fmt-seg">
        <button type="button" data-fmt="md" aria-pressed="true">Markdown</button>
        <button type="button" data-fmt="html" aria-pressed="false">HTML</button>
      </div>
    </div>
    <label class="field"><span>Save as (full path; an existing file is never overwritten)</span>
      <input class="text mono" id="export-path" type="text" spellcheck="false" autocomplete="off">
    </label>
    <div id="export-msg" role="status" aria-live="polite"></div>
  </div>
  <div class="foot">
    <button class="btn" type="button" id="export-cancel">Close</button>
    <button class="btn primary" type="button" id="export-save">Save report</button>
  </div>
</dialog>

      : h("div", { class: "legend" }, h("span", { class: "heat0", text: "No new files" }), h("span", { class: "heat1", text: "All files new in the last " + state.days + " days" }));
    const ss = state.sizeSort;
    const cols = [
      { key: "name", title: "Name", cls: "name", render: (r) => r.name, sort: (r) => r.name.toLowerCase() },
      { key: "bytes", title: "Size", num: true, render: (r) => fmtBytes(r.bytes), sort: (r) => r.bytes },
      { key: "share", title: "Share", num: true, render: (r) => s.bytes > 0 ? ((100 * r.bytes) / s.bytes).toFixed(1) + "%" : "-", sort: (r) => r.bytes },
      { key: "newBytes", title: "New", num: true, render: (r) => r.newBytes ? fmtBytes(r.newBytes) : h("span", { class: "faint", text: "-" }), sort: (r) => r.newBytes },
      { key: "changedBytes", title: "Changed", num: true, render: (r) => r.changedBytes ? fmtBytes(r.changedBytes) : h("span", { class: "faint", text: "-" }), sort: (r) => r.changedBytes },
      { key: "files", title: "Files", num: true, render: (r) => fmtCount(r.files), sort: (r) => r.files },
      { key: "label", title: "Label", render: chip, sort: (r) => labelKey(r) },
      { key: "what", title: "What it is", cls: "what", render: (r) => r.what },
    ];
    const table = grid(cols, f.children, {
      sort: ss, onSort: (k) => { state.sizeSort = { key: k, dir: ss.key === k && ss.dir === "desc" ? "asc" : "desc" }; render(); },
      onOpen: (r) => { state.sizePath = r.path; render(); }, canOpen: (r) => r.folders > 0 || r.files > 0, empty: "No subfolders.",
    });
    const files = new Map();
    for (const x of f.largeFiles) files.set(x.path, Object.assign({}, x));
    for (const x of f.recentFiles) files.set(x.path, Object.assign(files.get(x.path) || {}, x));
    const fileRows = Array.from(files.values());
    const fcols = [
      { key: "name", title: "File", cls: "name", render: (x) => x.name, sort: (x) => x.name.toLowerCase() },
      { key: "size", title: "Size", num: true, render: (x) => fmtBytes(x.size), sort: (x) => x.size },
      { key: "created", title: "Created", num: true, render: (x) => day(x.created), sort: (x) => x.created || "" },
      { key: "modified", title: "Modified", num: true, render: (x) => day(x.modified), sort: (x) => x.modified },
      { key: "kind", title: "In window", render: (x) => x.kind === "new" ? h("span", { class: "kind new", text: "New" }) : x.kind === "changed" ? h("span", { class: "kind", text: "Changed, growth unknown" }) : h("span", { class: "faint", text: "-" }), sort: (x) => x.kind || "" },
    ];
    const fsort = state.fileSort || (state.fileSort = { key: "size", dir: "desc" });
    const ownLine = f.own.files > 0 ? fmtCount(f.own.files) + " files directly in this folder, " + fmtBytes(f.own.bytes) : "No files directly in this folder";
    return [
      f.path.toLowerCase() !== f.scanRoot.toLowerCase() ? h("div", { class: "row crumb-row" }, crumbs(f.path, f.scanRoot), up) : null,
      h("h3", { class: "sub-title", text: f.name }),
      f.name !== f.path ? h("p", { class: "lead mono-lead" }, pathNode(f.path)) : null,
      section("This folder", null, chip(s),
        h("div", { class: "body" },
          h("dl", { class: "explain" },
            h("dt", { text: "Size" }), h("dd", { class: "tnum", text: fmtBytes(s.bytes) + "  (" + fmtCount(s.files) + " files, " + fmtCount(s.folders) + " folders)" }),
            h("dt", { text: "Last " + state.days + " days" }), h("dd", { text: "New " + fmtBytes(s.newBytes) + ", older files changed " + fmtBytes(s.changedBytes) + " (growth unknown)" }),
            h("dt", { text: "What it is" }), h("dd", { text: s.what }),
            s.owner ? h("dt", { text: "Probably belongs to" }) : null, s.owner ? h("dd", { text: s.owner }) : null,
            h("dt", { text: "How to reclaim" }), h("dd", { text: s.reclaim }),
            s.notes ? h("dt", { text: "Notes" }) : null, s.notes ? h("dd", { text: s.notes }) : null))),
      section("Map", null, h("div", { class: "row" }, legend, colorSeg), h("div", { class: "body" }, treemap(tm, info), info)),
      section("Folders", f.children.length + " folders  \u00B7  " + ownLine, null, table),
      section("Files", "new files and changed older files of " + fmtBytes(f.fileFloorBytes) + " or more, and files of " + fmtBytes(f.largeFileBytes) + " or more", null,
        grid(fcols, fileRows, { sort: fsort, onSort: (k) => { state.fileSort = { key: k, dir: fsort.key === k && fsort.dir === "desc" ? "asc" : "desc" }; render(); }, empty: "No large or recent files directly in this folder." })),
    ];
  }

  // ---------- cleanup view ----------
  async function renderCleanup() {
    let p;
    try { p = await cached("/api/cleanup", { path: state.root, days: state.days, limit: 100 }); } catch (e) { return [errorBox(e)]; }
    const rank = new Map(p.candidates.map((c, i) => [c, i + 1]));
    const cols = [
      { key: "rank", title: "#", num: true, render: (r) => rank.get(r), sort: (r) => rank.get(r) },
      { key: "path", title: "Folder", cls: "path", render: (r) => h("span", null, pathNode(r.path), r.groupCount ? h("span", { class: "tag", text: r.groupCount + " folders" }) : null, r.scope === "rest" ? h("span", { class: "tag", text: "the rest" }) : null), sort: (r) => r.path.toLowerCase() },
      { key: "bytes", title: "Size", num: true, render: (r) => fmtBytes(r.bytes), sort: (r) => r.bytes },
      { key: "newBytes", title: "New files", num: true, render: (r) => r.newBytes ? fmtBytes(r.newBytes) : h("span", { class: "faint", text: "-" }), sort: (r) => r.newBytes },
      { key: "label", title: "Label", render: chip, sort: (r) => (r.known === false ? 2 : r.label === "safe" ? 0 : 1) },
      { key: "reclaim", title: "How to reclaim", cls: "wrap what", render: (r) => reclaimNode(r, false) },
    ];
    const cs = state.cleanSort || (state.cleanSort = { key: "rank", dir: "asc" });
    const safeBytes = p.candidates.filter((c) => c.known && c.label === "safe").reduce((a, c) => a + c.bytes, 0);
    const checkBytes = p.candidates.filter((c) => c.known && c.label === "check_first").reduce((a, c) => a + c.bytes, 0);
    const stat = (k, v) => h("div", { class: "stat" }, h("div", { class: "k", text: k }), h("div", { class: "v", text: v }));
    return [
      h("p", { class: "exp-note", text: "Ranked proposals: safe items first, then items to check, then large folders DiskDelta does not know. Nothing here is deleted by DiskDelta; use each item's own way to reclaim the space. Select a row to open the folder." }),
      section("Summary", null, null, h("div", { class: "body" }, h("div", { class: "stats" }, stat("Safe to remove", fmtBytes(safeBytes)), stat("Check first", fmtBytes(checkBytes)), stat("Candidates", fmtCount(p.candidates.length))))),
      section("Candidates", null, null, grid(cols, p.candidates, {
        sort: cs, onSort: (k) => { state.cleanSort = { key: k, dir: cs.key === k && cs.dir === "asc" ? "desc" : "asc" }; render(); },
        onOpen: (r) => { state.sizePath = r.path.replace(/\\[^\\]*\*$/, ""); openDetails("size"); }, empty: "No candidates found.",
      }), h("div", { class: "foot", text: p.note })),
    ];
  }

  // ---------- skipped view ----------
  async function renderSkipped() {
    let s;
    try { s = await cached("/api/skipped", { limit: 2000 }); } catch (e) { return [errorBox(e)]; }
    const reasons = { access_denied: "Access denied", path_too_long: "Path too long", in_use: "In use", not_found: "Gone during the scan", error: "Other error" };
    const cols = [
      { key: "path", title: "Path", cls: "path", render: (r) => pathNode(r.path), sort: (r) => r.path.toLowerCase() },
      { key: "kind", title: "Kind", render: (r) => r.kind, sort: (r) => r.kind },
      { key: "reason", title: "Reason", render: (r) => reasons[r.reason] || r.reason, sort: (r) => r.reason },
      { key: "detail", title: "Detail", cls: "faint", render: (r) => r.detail || "" },
    ];
    const ks = state.skipSort || (state.skipSort = { key: "path", dir: "asc" });
    const summary = Object.entries(s.byReason).map(([k, v]) => (reasons[k] || k) + ": " + fmtCount(v)).join("   ");
    return [
      h("p", { class: "exp-note", text: "Folders and files DiskDelta could not read. Their sizes are not in the totals. Most are system folders that need admin rights; DiskDelta never asks for them." }),
      section("Could not be read", fmtCount(s.total) + " items" + (summary ? "  \u00B7  " + summary : ""), null,
        grid(cols, s.items, { sort: ks, onSort: (k) => { state.skipSort = { key: k, dir: ks.key === k && ks.dir === "asc" ? "desc" : "asc" }; render(); }, empty: "Nothing was skipped." })),
    ];
  }

  // ---------- render ----------
  let renderSeq = 0;
  async function render() {
    const seq = ++renderSeq;
    setTabs();
    const running = state.job && state.job.state === "running";
    let nodes;
    if (running) nodes = renderProgress();
    else if (state.view === "overview" && state.root) nodes = await renderOverview();
    else nodes = await renderDrives();
    if (seq !== renderSeq) return;
    const banners = [];
    if (state.stopped) banners.push(h("div", { class: "note stopped", role: "alert", text: "DiskDelta has stopped. Start it again to continue; this page no longer updates." }));
    if (STATIC) banners.push(h("div", { class: "note", text: "Browser demo: DiskDelta running on a fictional PC with invented folders and files, entirely in this page. Nothing is read from your computer. To scan your own drives, get DiskDelta from northkeellabs.com/diskdelta." }));
    else if (state.mode === "demo") banners.push(h("div", { class: "note", text: "Demo mode: a fictional PC with invented folders and files. Nothing on your own drives is read." }));
    if (state.lastJobError) banners.push(h("div", { class: "note stopped", role: "alert", text: state.lastJobError }));
    const y = window.scrollY;
    view.replaceChildren(...banners, ...nodes.filter(Boolean));
    if (!running) window.scrollTo(0, Math.min(y, document.body.scrollHeight));
  }
  function alertBanner(e) { state.lastJobError = String(e && e.message || e); render(); }

  // ---------- live updates ----------
  let lastProgressRender = 0;
  function onJob(job, isProgress) {
    if (!job) return;
    if (job.id === state.handledJobId) return;
    state.job = job;
    const showing = progressEls && document.getElementById("progress-view") && progressEls.jobId === job.id && progressEls.index === job.index;
    if (isProgress) {
      const now = Date.now();
      if (now - lastProgressRender < 250) return;
      lastProgressRender = now;
      if (showing) updateProgress(job); else render();
      return;
    }
    if (job.state === "running") { state.lastJobError = null; if (!showing) render(); return; }
    state.handledJobId = job.id;
    refreshAfterScan(job);
  }
  async function refreshAfterScan(job) {
    const st = await api("/api/state");
    state.scans = st.scans;
    state.job = job;
    if (job.state === "error") state.lastJobError = "Scan failed: " + job.error;
    const found = state.scans.find((s) => s.root.toLowerCase() === (job.targets[0] || "").toLowerCase()) || state.scans[state.scans.length - 1];
    cache.clear();
    state.scanSeq++;
    if (found) { setRoot(found.root); if (job.state === "done") state.view = "overview"; }
    if (job.state === "done" && !hashUsed) {
      hashUsed = true;
      if (hashParams.view) state.view = hashParams.view;
      if (hashParams.open) hashParams.open.split(",").forEach((k) => state.open.add(k));
      if (hashParams.path) state.sizePath = hashParams.path;
      if (hashParams.sun) state.sunPath = hashParams.sun;
      if (hashParams.color) state.colorBy = hashParams.color;
      if (hashParams.tltable) state.tlTable = true;
      if (hashParams.suntable) state.sunTable = true;
      if (hashParams.days) setDays(Number(hashParams.days));
      if (hashParams.tl) {
        const tl = await cached("/api/timeline", { path: state.root, days: state.days });
        state.tlAge = hashParams.tl === "max" ? [...tl.bars].sort((a, b) => b.newBytes - a.newBytes)[0].age : Number(hashParams.tl);
      }
    }
    await render();
    if (job.state === "done" && hashParams.open && hashParams.scrollto) document.getElementById("details-" + hashParams.scrollto)?.scrollIntoView({ block: "start" });
    if (job.state === "done" && hashParams.export) document.getElementById("export-btn").click();
  }

  function connectEvents() {
    if (STATIC) { STATIC.onEvent((e) => onJob(e.job, e.type === "progress")); return; }
    const es = new EventSource("/api/events?t=" + encodeURIComponent(TOKEN));
    es.addEventListener("job", (ev) => onJob(JSON.parse(ev.data), false));
    es.addEventListener("progress", (ev) => onJob(JSON.parse(ev.data), true));
  }

  let hbFails = 0;
  if (!STATIC) setInterval(() => {
    if (state.stopped) return;
    post("/api/heartbeat").then(() => (hbFails = 0), () => { if (++hbFails >= 2) { state.stopped = true; render(); } });
  }, 15000);
  if (!STATIC) post("/api/heartbeat").catch(() => {});
  if (!STATIC) window.addEventListener("pagehide", () => { navigator.sendBeacon("/api/bye?t=" + encodeURIComponent(TOKEN)); });

  // ---------- export ----------
  const dlg = document.getElementById("export-dialog");
  const fmtSeg = Array.from(document.querySelectorAll("#fmt-seg button"));
  const pathIn = document.getElementById("export-path");
  const msg = document.getElementById("export-msg");
  function setFmt(f) {
    state.fmt = f;
    fmtSeg.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.fmt === f)));
    const cur = pathIn.value.trim();
    if (!cur || cur === state.exportSuggestion.md || cur === state.exportSuggestion.html) pathIn.value = state.exportSuggestion[f];
    else pathIn.value = cur.replace(/\.(md|html)$/i, "." + f);
  }
  fmtSeg.forEach((b) => b.addEventListener("click", () => setFmt(b.dataset.fmt)));
  document.getElementById("export-btn").addEventListener("click", () => { msg.replaceChildren(); setFmt(state.fmt); dlg.showModal(); pathIn.focus(); pathIn.select(); });
  document.getElementById("export-cancel").addEventListener("click", () => dlg.close());
  document.getElementById("export-save").addEventListener("click", async () => {
    msg.replaceChildren(h("span", { class: "muted", text: "Saving..." }));
    if (STATIC) {
      // browser demo: build the report in the page and hand it to the browser as a download
      try {
        const text = await api("/api/report", { format: state.fmt, days: state.days });
        const name = (pathIn.value.trim().split(/[\\/]/).pop() || ("diskdelta-report." + state.fmt)).replace(/[^\w.-]/g, "_");
        const a = h("a", { download: name });
        a.href = URL.createObjectURL(new Blob([text], { type: state.fmt === "html" ? "text/html" : "text/markdown" }));
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        msg.replaceChildren(h("span", { class: "okmsg", text: "Downloaded " + name + "." }));
      } catch (e) { msg.replaceChildren(h("span", { class: "error", text: e.message })); }
      return;
    }
    try {
      const r = await post("/api/export", { format: state.fmt, path: pathIn.value.trim(), days: state.days });
      msg.replaceChildren(h("span", { class: "okmsg", text: "Saved " + r.path + " (" + fmtBytes(r.bytes) + ")." }));
    } catch (e) { msg.replaceChildren(h("span", { class: "error", text: e.message })); }
  });
  pathIn.addEventListener("keydown", (ev) => { if (ev.key === "Enter") document.getElementById("export-save").click(); });

  // ---------- start ----------
  // Optional URL fragment for links and screenshots: #scan=C:\,D:\&view=size&path=C:\Users&color=growth&days=7&export=1
  const hashParams = Object.fromEntries(new URLSearchParams((location.hash || "").slice(1)));
  let hashUsed = false;
  (async () => {
    try {
      const st = await api("/api/state");
      state.mode = st.mode; state.scans = st.scans; state.job = st.job; state.exportSuggestion = st.exportSuggestion;
      if (st.job && st.job.state !== "running") state.handledJobId = st.job.id;
      if (STATIC) {
        for (const k of ["md", "html"]) state.exportSuggestion[k] = state.exportSuggestion[k].split("\\").pop();
        document.querySelector("#export-path").previousElementSibling.textContent = "File name (your browser saves the download)";
        document.getElementById("export-save").textContent = "Download report";
      }
      document.getElementById("ver").textContent = "v" + st.version;
      document.getElementById("demo-badge").classList.toggle("hidden", st.mode !== "demo");
      if (st.mode === "demo") document.title = "DiskDelta (demo)";
      if (state.scans.length) setRoot(state.scans[state.scans.length - 1].root);
      connectEvents();
      await render();
      if (hashParams.scan) startScan(hashParams.scan.split(","));
    } catch (e) {
      view.replaceChildren(errorBox(e));
    }
  })();
})();
</script>
