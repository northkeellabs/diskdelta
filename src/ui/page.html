<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>DiskDelta</title>
<style nonce="__NONCE__">
:root {
  --bg: #f3f3f3;
  --surface: #ffffff;
  --surface-2: #f8f8f8;
  --hover: #f0f0f0;
  --border: #e3e3e3;
  --border-strong: #cdcdcd;
  --text: #1a1a1a;
  --text-2: #5c5c5c;
  --text-3: #737373;
  --accent: #0a5fb4;
  --accent-hover: #084f96;
  --accent-soft: #e6eef8;
  --accent-text: #ffffff;
  --focus: #0a5fb4;
  --safe-fg: #276843;
  --safe-bg: #e4f1e8;
  --safe-tile: #d6eadc;
  --check-fg: #7a5600;
  --check-bg: #f7eed8;
  --check-tile: #f2e7c9;
  --dnt-fg: #9a2f3a;
  --dnt-bg: #f6e3e5;
  --dnt-tile: #f0d6d9;
  --unk-fg: #555555;
  --unk-bg: #ececec;
  --unk-tile: #e4e4e4;
  --tile-line: rgba(0,0,0,0.16);
  --bar-track: #e6e6e6;
  --bar-full: #b07a00;
  --shadow: 0 1px 2px rgba(0,0,0,0.06);
  --radius: 6px;
  --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1b1b;
    --surface: #242424;
    --surface-2: #2a2a2a;
    --hover: #2f2f2f;
    --border: #353535;
    --border-strong: #474747;
    --text: #ebebeb;
    --text-2: #a8a8a8;
    --text-3: #8f8f8f;
    --accent: #62a4f0;
    --accent-hover: #7db4f3;
    --accent-soft: #1d2d40;
    --accent-text: #0d1824;
    --focus: #62a4f0;
    --safe-fg: #8ccfa3;
    --safe-bg: #1e3226;
    --safe-tile: #25382c;
    --check-fg: #e2bd6b;
    --check-bg: #372d16;
    --check-tile: #3a3222;
    --dnt-fg: #eea0a8;
    --dnt-bg: #3a2124;
    --dnt-tile: #45292d;
    --unk-fg: #b3b3b3;
    --unk-bg: #2f2f2f;
    --unk-tile: #333333;
    --tile-line: rgba(0,0,0,0.55);
    --bar-track: #363636;
    --bar-full: #d9a640;
    --shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.num, td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.mono { font-family: var(--mono); font-size: 12.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- top bar ---------- */
header.bar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 24px;
  height: 52px; padding: 0 24px;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: baseline; gap: 8px; font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
.brand .ver { font-weight: 400; font-size: 12px; color: var(--text-3); }
.badge { display: inline-block; padding: 1px 7px; border: 1px solid var(--border-strong); border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-2); }
nav.tabs { display: flex; gap: 2px; height: 100%; }
nav.tabs button {
  position: relative; height: 100%; padding: 0 12px; border: 0; background: none; cursor: pointer;
  color: var(--text-2); font-weight: 500;
}
nav.tabs button:hover:not([disabled]) { color: var(--text); }
nav.tabs button[aria-selected="true"] { color: var(--text); }
nav.tabs button[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; background: var(--accent); border-radius: 2px 2px 0 0; }
nav.tabs button[disabled] { color: var(--text-3); cursor: default; }
.bar .spacer { flex: 1; }
.bar .controls { display: flex; align-items: center; gap: 12px; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 12px; border-radius: 5px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-weight: 500;
  transition-property: background-color, border-color, transform;
  transition-duration: 120ms; transition-timing-function: ease-out;
}
.btn:hover:not([disabled]) { background: var(--hover); }
.btn:active:not([disabled]) { transform: scale(0.96); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn.primary:hover:not([disabled]) { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.small { position: relative; height: 26px; padding: 0 9px; font-size: 13px; }
.btn.small::after, .crumbs button::after, table.grid thead th button::before, .check::after { content: ""; position: absolute; inset: -7px -4px; }
.btn.link { border-color: transparent; background: none; color: var(--accent); padding: 0 4px; height: auto; }
.btn.link:hover:not([disabled]) { background: none; text-decoration: underline; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 5px; overflow: hidden; }
.seg button { height: 28px; padding: 0 10px; border: 0; border-left: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--hover); color: var(--text); }
input.text {
  height: 30px; padding: 0 9px; border: 1px solid var(--border-strong); border-radius: 5px; background: var(--surface);
  min-width: 0;
}
input.text:focus-visible { outline-offset: 0; }
input.days { width: 76px; text-align: right; font-variant-numeric: tabular-nums; }
.tnum { font-variant-numeric: tabular-nums; }
input.days::-webkit-inner-spin-button, input.days::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input.days { -moz-appearance: textfield; appearance: textfield; }
.crumb-row { margin-bottom: 8px; justify-content: space-between; }
p.lead.mono-lead { font-family: var(--mono); font-size: 12.5px; margin-bottom: 16px; overflow-wrap: anywhere; }
label.inline { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 13px; }

/* ---------- layout ---------- */
main { max-width: 1320px; margin: 0 auto; padding: 24px; }
.section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; }
.section > .head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.section > .head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.section > .head .sub { color: var(--text-2); font-size: 13px; }
.section > .head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.section > .body { padding: 16px; }
.section > .foot { padding: 10px 16px; border-top: 1px solid var(--border); color: var(--text-2); font-size: 13px; }
h1.page { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; text-wrap: balance; }
.section > .head h2 { text-wrap: balance; }
p.lead { margin: 0 0 20px; color: var(--text-2); max-width: 760px; text-wrap: pretty; }
td.what, .explain dd, .section > .foot, .note { text-wrap: pretty; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.stats { display: flex; gap: 32px; flex-wrap: wrap; }
.stat .k { font-size: 12px; color: var(--text-2); }
.stat .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.stat .v small { font-size: 13px; font-weight: 400; color: var(--text-2); }
.stats.summary { align-items: flex-end; gap: 48px; }
.stat.headline .v { font-size: 28px; letter-spacing: -0.02em; }
.stat.secondary .k { color: var(--text-3); }
.stat.secondary .v { font-size: 15px; font-weight: 500; color: var(--text-2); }
td.secondary { color: var(--text-2); }

/* ---------- tables ---------- */
table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
table.grid th, table.grid td { padding: 7px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
table.grid thead th { position: sticky; top: 52px; background: var(--surface-2); color: var(--text-2); font-weight: 600; font-size: 12px; z-index: 1; }
table.grid thead th button { all: unset; position: relative; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
table.grid thead th button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
table.grid thead th[aria-sort] button::after { content: ""; display: inline-block; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; }
table.grid thead th[aria-sort="descending"] button::after { border-top: 5px solid currentColor; }
table.grid thead th[aria-sort="ascending"] button::after { border-bottom: 5px solid currentColor; }
table.grid tbody tr { transition: background-color 80ms ease; }
table.grid tbody tr:hover { background: var(--hover); }
table.grid tbody tr.clickable { cursor: pointer; }
table.grid tbody tr:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
table.grid tbody tr:last-child td { border-bottom: 0; }
table.grid th.num, table.grid td.num { text-align: right; }
td.path { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
td.name { font-weight: 500; }
td.what { color: var(--text-2); min-width: 220px; }
td.wrap { white-space: normal; }
.empty { padding: 28px 16px; text-align: center; color: var(--text-2); }
.table-scroll { min-width: 0; }

/* ---------- labels ---------- */
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip.safe { color: var(--safe-fg); background: var(--safe-bg); }
.chip.check_first { color: var(--check-fg); background: var(--check-bg); }
.chip.do_not_touch { color: var(--dnt-fg); background: var(--dnt-bg); }
.chip.unknown { color: var(--unk-fg); background: var(--unk-bg); }
.kind { font-size: 12px; color: var(--text-2); }
.kind.new { color: var(--accent); font-weight: 600; }

/* ---------- drive bars ---------- */
.meter { width: 160px; height: 6px; background: var(--bar-track); border-radius: 3px; overflow: hidden; }
.meter > div { height: 100%; background: var(--accent); border-radius: 3px; }
.meter.full > div { background: var(--bar-full); }
.progress { height: 4px; background: var(--bar-track); border-radius: 2px; overflow: hidden; }
.progress > div { height: 100%; width: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left center; transition: transform 300ms ease-out; }
.progress.indeterminate > div { width: 30%; transform: none; transition: none; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
@media (prefers-reduced-motion: reduce) { .progress.indeterminate > div { animation: none; width: 100%; opacity: 0.4; } * { transition: none !important; } }

/* ---------- breadcrumb + folder header ---------- */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 13px; }
.crumbs button { all: unset; position: relative; cursor: pointer; padding: 2px 5px; border-radius: 4px; color: var(--text-2); }
.crumbs button:hover { background: var(--hover); color: var(--text); }
.crumbs button:focus-visible { outline: 2px solid var(--focus); }
.crumbs .cur { padding: 2px 5px; font-weight: 600; color: var(--text); }
.crumbs .sep { color: var(--text-3); }
.explain { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13px; }
.explain dt { color: var(--text-2); }
.explain dd { margin: 0; }
code.cmd { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }

/* ---------- treemap ---------- */
.tm-wrap { position: relative; }
.treemap { position: relative; height: 420px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.tile {
  position: absolute; overflow: hidden; cursor: pointer;
  border: 1px solid var(--tile-line); background: var(--unk-tile);
}
.tile.hover { box-shadow: inset 0 0 0 2px var(--text-2); }
.check { position: relative; display: inline-flex; width: 16px; height: 16px; align-items: center; justify-content: center; cursor: pointer; }
.check input { margin: 0; cursor: pointer; }
.tile:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; z-index: 2; }
.tile.safe { background: var(--safe-tile); }
.tile.check_first { background: var(--check-tile); }
.tile.do_not_touch { background: var(--dnt-tile); }
.tile.unknown { background: var(--unk-tile); }
.tile.other { background: var(--surface-2); border-style: dashed; border-color: var(--border-strong); }
.tile .t { position: absolute; left: 5px; right: 5px; top: 2px; height: 16px; font-size: 12px; font-weight: 600; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); pointer-events: none; }
.tile .t .s { font-weight: 400; color: var(--text-2); font-variant-numeric: tabular-nums; margin-left: 6px; }
.tile .heatfill { position: absolute; inset: 0; background: var(--accent); pointer-events: none; }
.tile.heat { background: var(--surface-2); }
.tm-info { min-height: 22px; margin-top: 8px; font-size: 13px; color: var(--text-2); display: flex; gap: 16px; flex-wrap: wrap; }
.tm-info b { color: var(--text); font-weight: 600; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); align-items: center; flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--unk-tile); }
.legend .safe::before { background: var(--safe-tile); }
.legend .check_first::before { background: var(--check-tile); }
.legend .do_not_touch::before { background: var(--dnt-tile); }
.legend .heat0::before { background: var(--surface-2); border: 1px solid var(--border-strong); }
.legend .heat1::before { background: var(--accent); }

/* ---------- banners / dialog ---------- */
.note { padding: 10px 14px; border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--surface); border-radius: 4px; color: var(--text-2); font-size: 13px; margin-bottom: 16px; }
.note.stopped { border-left-color: var(--dnt-fg); color: var(--text); }
.error { color: var(--dnt-fg); font-size: 13px; }
.okmsg { color: var(--safe-fg); font-size: 13px; }
dialog { border: 1px solid var(--border-strong); border-radius: 8px; padding: 0; background: var(--surface); color: var(--text); width: min(560px, 92vw); box-shadow: 0 8px 28px rgba(0,0,0,0.18); }
dialog::backdrop { background: rgba(0,0,0,0.3); }
dialog .head { padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 600; }
dialog .body { padding: 16px 18px; display: grid; gap: 12px; }
dialog .foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }
dialog .field { display: grid; gap: 4px; }
dialog .field > span { font-size: 12px; color: var(--text-2); }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border: 1px solid var(--border-strong); border-radius: 3px; color: var(--text-2); margin-left: 6px; font-weight: 500; vertical-align: 1px; }
.progress-wrap { margin: 18px 0 10px; }
.current-path { font-family: var(--mono); font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; direction: rtl; text-align: left; }
.hidden { display: none !important; }
footer.foot { max-width: 1320px; margin: 0 auto; padding: 0 24px 32px; color: var(--text-3); font-size: 12px; }

/* ================= redesign: insight first, visuals second, tables in details ================= */
:root {
  --fs-xs: 12px; --fs-sm: 13px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 20px; --fs-2xl: 28px; --fs-3xl: 36px; --fs-hero: 56px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;
  --card-radius: 10px;
  --card-shadow: 0 0 0 1px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04), 0 2px 10px rgba(0,0,0,0.05);
  --c-safe: #3a9a64; --c-check: #d39a2c; --c-dnt: #cc5a66; --c-unknown: #a9a9a9; --c-personal: #8770c8; --c-other: #dcdcdc; --c-container: #c9d2dc;
  --c-bar: var(--accent); --c-bar-sel: #063f78;
}
@media (prefers-color-scheme: dark) {
  :root {
    --card-shadow: 0 0 0 1px rgba(255,255,255,0.07), 0 1px 2px rgba(0,0,0,0.5), 0 4px 16px rgba(0,0,0,0.35);
    --c-safe: #4cb47b; --c-check: #ddac48; --c-dnt: #df707b; --c-unknown: #7b7b7b; --c-personal: #a28fe0; --c-other: #3b3b3b; --c-container: #4a5560;
    --c-bar-sel: #b4d3fa;
  }
}
main { max-width: 1240px; padding: var(--sp-6) var(--sp-5) var(--sp-7); }
h1.display { font-size: var(--fs-3xl); line-height: 1.15; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 var(--sp-2); text-wrap: balance; }
.intro { margin-bottom: var(--sp-6); }
.intro .lead { font-size: var(--fs-lg); max-width: 680px; margin-bottom: var(--sp-5); }
.btn.big { height: 40px; padding: 0 var(--sp-5); font-size: var(--fs-md); font-weight: 600; border-radius: 6px; }
.row.pad { padding: var(--sp-3) var(--sp-4); }
p.pad { padding: var(--sp-3) var(--sp-4); margin: 0; }
.folder-input { width: min(420px, 100%); }

/* blocks: soft cards for the overview */
.block { background: var(--surface); border: 1px solid transparent; border-radius: var(--card-radius); box-shadow: var(--card-shadow); padding: var(--sp-5); margin-bottom: var(--sp-5); }
.block-head { display: flex; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-4); flex-wrap: wrap; }
.block-head h2 { margin: 0; font-size: var(--fs-xl); font-weight: 600; letter-spacing: -0.01em; }
.block-head .block-sub { color: var(--text-2); font-size: var(--fs-sm); }
.block-head .right { margin-left: auto; display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }

/* hero */
.hero { padding: var(--sp-2) 0 var(--sp-6); }
.hero-line { margin: 0; font-size: var(--fs-2xl); line-height: 1.2; font-weight: 500; letter-spacing: -0.015em; text-wrap: balance; }
.hero-where { font-weight: 650; }
.hero-num { display: inline-block; font-size: var(--fs-hero); font-weight: 700; letter-spacing: -0.03em; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; vertical-align: -6px; margin: 0 2px; }
.hero-sub { margin: var(--sp-3) 0 0; font-size: var(--fs-lg); color: var(--text-2); max-width: 760px; text-wrap: pretty; }
.hero-meta { margin: var(--sp-2) 0 0; font-size: var(--fs-sm); color: var(--text-3); font-variant-numeric: tabular-nums; }

/* insight cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--sp-4); }
.insight { display: flex; flex-direction: column; gap: var(--sp-2); padding: var(--sp-4) var(--sp-4) var(--sp-3); border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); min-width: 0; }
.insight-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-2); }
.insight-top h3 { margin: 0; font-size: var(--fs-lg); font-weight: 600; line-height: 1.3; text-wrap: balance; }
.insight-num .plus { font-size: var(--fs-2xl); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.insight-num .unit { font-size: var(--fs-md); color: var(--text-2); }
.insight-sub { font-size: var(--fs-xs); color: var(--text-3); font-variant-numeric: tabular-nums; }
.insight-what { margin: 0; color: var(--text-2); font-size: var(--fs-sm); text-wrap: pretty; }
.insight-path { font-family: var(--mono); font-size: var(--fs-xs); color: var(--text-3); overflow-wrap: anywhere; }
.insight-action { font-size: var(--fs-sm); margin-top: auto; padding-top: var(--sp-2); border-top: 1px solid var(--border); min-height: 54px; }
.insight-foot { display: flex; justify-content: flex-end; }
.reclaim { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 6px; }
.reclaim .muted { flex-basis: 100%; }

/* timeline */
.tl-chart { width: 100%; min-height: 230px; }
.tl-svg { display: block; overflow: visible; }
.axis { font-size: 11px; fill: var(--text-3); font-variant-numeric: tabular-nums; }
.grid-line { stroke: var(--border); stroke-width: 1; }
.axis-line { stroke: var(--border-strong); stroke-width: 1; }
.bar { fill: var(--c-bar); }
.bar-hit { fill: transparent; }
.bar-g { cursor: pointer; outline: none; }

<header class="bar">

<main id="view" role="tabpanel" aria-labelledby="tab-drives" tabindex="-1"></main>

<footer class="foot">DiskDelta is read-only: it never deletes, moves or changes anything on your drives. Free and open source, by Northkeel Labs (northkeellabs.com/diskdelta).</footer>

</dialog>

      : h("div", { class: "legend" }, h("span", { class: "heat0", text: "No new files" }), h("span", { class: "heat1", text: "All files new in the last " + state.days + " days" }));
    const ss = state.sizeSort;
    const cols = [
      { key: "name", title: "Name", cls: "name", render: (r) => r.name, sort: (r) => r.name.toLowerCase() },
      { key: "bytes", title: "Size", num: true, render: (r) => fmtBytes(r.bytes), sort: (r) => r.bytes },
      { key: "share", title: "Share", num: true, render: (r) => s.bytes > 0 ? ((100 * r.bytes) / s.bytes).toFixed(1) + "%" : "-", sort: (r) => r.bytes },
      { key: "newBytes", title: "New", num: true, render: (r) => r.newBytes ? fmtBytes(r.newBytes) : h("span", { class: "faint", text: "-" }), sort: (r) => r.newBytes },
      { key: "changedBytes", title: "Changed", num: true, render: (r) => r.changedBytes ? fmtBytes(r.changedBytes) : h("span", { class: "faint", text: "-" }), sort: (r) => r.changedBytes },
      { key: "files", title: "Files", num: true, render: (r) => fmtCount(r.files), sort: (r) => r.files },
      { key: "label", title: "Label", render: chip, sort: (r) => labelKey(r) },
      { key: "what", title: "What it is", cls: "what", render: (r) => r.what },
    ];
    const table = grid(cols, f.children, {
      sort: ss, onSort: (k) => { state.sizeSort = { key: k, dir: ss.key === k && ss.dir === "desc" ? "asc" : "desc" }; render(); },
      onOpen: (r) => { state.sizePath = r.path; render(); }, canOpen: (r) => r.folders > 0 || r.files > 0, empty: "No subfolders.",
    });
    const files = new Map();
    for (const x of f.largeFiles) files.set(x.path, Object.assign({}, x));
    for (const x of f.recentFiles) files.set(x.path, Object.assign(files.get(x.path) || {}, x));
    const fileRows = Array.from(files.values());
    const fcols = [
      { key: "name", title: "File", cls: "name", render: (x) => x.name, sort: (x) => x.name.toLowerCase() },
      { key: "size", title: "Size", num: true, render: (x) => fmtBytes(x.size), sort: (x) => x.size },
      { key: "created", title: "Created", num: true, render: (x) => day(x.created), sort: (x) => x.created || "" },
      { key: "modified", title: "Modified", num: true, render: (x) => day(x.modified), sort: (x) => x.modified },
      { key: "kind", title: "In window", render: (x) => x.kind === "new" ? h("span", { class: "kind new", text: "New" }) : x.kind === "changed" ? h("span", { class: "kind", text: "Changed, growth unknown" }) : h("span", { class: "faint", text: "-" }), sort: (x) => x.kind || "" },
    ];
    const fsort = state.fileSort || (state.fileSort = { key: "size", dir: "desc" });
    const ownLine = f.own.files > 0 ? fmtCount(f.own.files) + " files directly in this folder, " + fmtBytes(f.own.bytes) : "No files directly in this folder";
    return [
      f.path.toLowerCase() !== f.scanRoot.toLowerCase() ? h("div", { class: "row crumb-row" }, crumbs(f.path, f.scanRoot), up) : null,
      h("h3", { class: "sub-title", text: f.name }),
      f.name !== f.path ? h("p", { class: "lead mono-lead" }, pathNode(f.path)) : null,
      section("This folder", null, chip(s),
        h("div", { class: "body" },
          h("dl", { class: "explain" },
            h("dt", { text: "Size" }), h("dd", { class: "tnum", text: fmtBytes(s.bytes) + "  (" + fmtCount(s.files) + " files, " + fmtCount(s.folders) + " folders)" }),
            h("dt", { text: "Last " + state.days + " days" }), h("dd", { text: "New " + fmtBytes(s.newBytes) + ", older files changed " + fmtBytes(s.changedBytes) + " (growth unknown)" }),
            h("dt", { text: "What it is" }), h("dd", { text: s.what }),
            s.owner ? h("dt", { text: "Probably belongs to" }) : null, s.owner ? h("dd", { text: s.owner }) : null,
            h("dt", { text: "How to reclaim" }), h("dd", { text: s.reclaim }),
            s.notes ? h("dt", { text: "Notes" }) : null, s.notes ? h("dd", { text: s.notes }) : null))),
      section("Map", null, h("div", { class: "row" }, legend, colorSeg), h("div", { class: "body" }, treemap(tm, info), info)),
      section("Folders", f.children.length + " folders  \u00B7  " + ownLine, null, table),
      section("Files", "new files and changed older files of " + fmtBytes(f.fileFloorBytes) + " or more, and files of " + fmtBytes(f.largeFileBytes) + " or more", null,
        grid(fcols, fileRows, { sort: fsort, onSort: (k) => { state.fileSort = { key: k, dir: fsort.key === k && fsort.dir === "desc" ? "asc" : "desc" }; render(); }, empty: "No large or recent files directly in this folder." })),
    ];
  }

  // ---------- cleanup view ----------
  async function renderCleanup() {
    let p;
    try { p = await cached("/api/cleanup", { path: state.root, days: state.days, limit: 100 }); } catch (e) { return [errorBox(e)]; }
    const rank = new Map(p.candidates.map((c, i) => [c, i + 1]));
    const cols = [
      { key: "rank", title: "#", num: true, render: (r) => rank.get(r), sort: (r) => rank.get(r) },
      { key: "path", title: "Folder", cls: "path", render: (r) => h("span", null, pathNode(r.path), r.groupCount ? h("span", { class: "tag", text: r.groupCount + " folders" }) : null, r.scope === "rest" ? h("span", { class: "tag", text: "the rest" }) : null), sort: (r) => r.path.toLowerCase() },
      { key: "bytes", title: "Size", num: true, render: (r) => fmtBytes(r.bytes), sort: (r) => r.bytes },
      { key: "newBytes", title: "New files", num: true, render: (r) => r.newBytes ? fmtBytes(r.newBytes) : h("span", { class: "faint", text: "-" }), sort: (r) => r.newBytes },
      { key: "label", title: "Label", render: chip, sort: (r) => (r.known === false ? 2 : r.label === "safe" ? 0 : 1) },
      { key: "reclaim", title: "How to reclaim", cls: "wrap what", render: (r) => reclaimNode(r, false) },
    ];
    const cs = state.cleanSort || (state.cleanSort = { key: "rank", dir: "asc" });
    const safeBytes = p.candidates.filter((c) => c.known && c.label === "safe").reduce((a, c) => a + c.bytes, 0);
    const checkBytes = p.candidates.filter((c) => c.known && c.label === "check_first").reduce((a, c) => a + c.bytes, 0);
    const stat = (k, v) => h("div", { class: "stat" }, h("div", { class: "k", text: k }), h("div", { class: "v", text: v }));
    return [
      h("p", { class: "exp-note", text: "Ranked proposals: safe items first, then items to check, then large folders DiskDelta does not know. Nothing here is deleted by DiskDelta; use each item's own way to reclaim the space. Select a row to open the folder." }),
      section("Summary", null, null, h("div", { class: "body" }, h("div", { class: "stats" }, stat("Safe to remove", fmtBytes(safeBytes)), stat("Check first", fmtBytes(checkBytes)), stat("Candidates", fmtCount(p.candidates.length))))),
      section("Candidates", null, null, grid(cols, p.candidates, {
        sort: cs, onSort: (k) => { state.cleanSort = { key: k, dir: cs.key === k && cs.dir === "asc" ? "desc" : "asc" }; render(); },
        onOpen: (r) => { state.sizePath = r.path.replace(/\\[^\\]*\*$/, ""); openDetails("size"); }, empty: "No candidates found.",
      }), h("div", { class: "foot", text: p.note })),
    ];
  }

  // ---------- skipped view ----------
  async function renderSkipped() {
    let s;
    try { s = await cached("/api/skipped", { limit: 2000 }); } catch (e) { return [errorBox(e)]; }
    const reasons = { access_denied: "Access denied", path_too_long: "Path too long", in_use: "In use", not_found: "Gone during the scan", error: "Other error" };
    const cols = [
      { key: "path", title: "Path", cls: "path", render: (r) => pathNode(r.path), sort: (r) => r.path.toLowerCase() },
      { key: "kind", title: "Kind", render: (r) => r.kind, sort: (r) => r.kind },
      { key: "reason", title: "Reason", render: (r) => reasons[r.reason] || r.reason, sort: (r) => r.reason },
      { key: "detail", title: "Detail", cls: "faint", render: (r) => r.detail || "" },
    ];
    const ks = state.skipSort || (state.skipSort = { key: "path", dir: "asc" });
    const summary = Object.entries(s.byReason).map(([k, v]) => (reasons[k] || k) + ": " + fmtCount(v)).join("   ");
    return [
      h("p", { class: "exp-note", text: "Folders and files DiskDelta could not read. Their sizes are not in the totals. Most are system folders that need admin rights; DiskDelta never asks for them." }),
      section("Could not be read", fmtCount(s.total) + " items" + (summary ? "  \u00B7  " + summary : ""), null,
        grid(cols, s.items, { sort: ks, onSort: (k) => { state.skipSort = { key: k, dir: ks.key === k && ks.dir === "asc" ? "desc" : "asc" }; render(); }, empty: "Nothing was skipped." })),
    ];
  }

  // ---------- render ----------
  let renderSeq = 0;
  async function render() {
    const seq = ++renderSeq;
    setTabs();
    const running = state.job && state.job.state === "running";
    let nodes;
    if (running) nodes = renderProgress();
    else if (state.view === "overview" && state.root) nodes = await renderOverview();
    else nodes = await renderDrives();
    if (seq !== renderSeq) return;
    const banners = [];
    if (state.stopped) banners.push(h("div", { class: "note stopped", role: "alert", text: "DiskDelta has stopped. Start it again to continue; this page no longer updates." }));
    if (STATIC) banners.push(h("div", { class: "note", text: "Browser demo: DiskDelta running on a fictional PC with invented folders and files, entirely in this page. Nothing is read from your computer. To scan your own drives, get DiskDelta from northkeellabs.com/diskdelta." }));
    else if (state.mode === "demo") banners.push(h("div", { class: "note", text: "Demo mode: a fictional PC with invented folders and files. Nothing on your own drives is read." }));
    if (state.lastJobError) banners.push(h("div", { class: "note stopped", role: "alert", text: state.lastJobError }));
    const y = window.scrollY;
    view.replaceChildren(...banners, ...nodes.filter(Boolean));
    if (!running) window.scrollTo(0, Math.min(y, document.body.scrollHeight));
  }
  function alertBanner(e) { state.lastJobError = String(e && e.message || e); render(); }

  // ---------- live updates ----------
  let lastProgressRender = 0;
  function onJob(job, isProgress) {
    if (!job) return;
    if (job.id === state.handledJobId) return;
    state.job = job;
    const showing = progressEls && document.getElementById("progress-view") && progressEls.jobId === job.id && progressEls.index === job.index;
    if (isProgress) {
      const now = Date.now();
      if (now - lastProgressRender < 250) return;
      lastProgressRender = now;
      if (showing) updateProgress(job); else render();
      return;
    }
    if (job.state === "running") { state.lastJobError = null; if (!showing) render(); return; }
    state.handledJobId = job.id;
    refreshAfterScan(job);
  }
  async function refreshAfterScan(job) {
    const st = await api("/api/state");
    state.scans = st.scans;
    state.job = job;
    if (job.state === "error") state.lastJobError = "Scan failed: " + job.error;
    const found = state.scans.find((s) => s.root.toLowerCase() === (job.targets[0] || "").toLowerCase()) || state.scans[state.scans.length - 1];
    cache.clear();
    state.scanSeq++;
    if (found) { setRoot(found.root); if (job.state === "done") state.view = "overview"; }
    if (job.state === "done" && !hashUsed) {
      hashUsed = true;
      if (hashParams.view) state.view = hashParams.view;
      if (hashParams.open) hashParams.open.split(",").forEach((k) => state.open.add(k));
      if (hashParams.path) state.sizePath = hashParams.path;
      if (hashParams.sun) state.sunPath = hashParams.sun;
      if (hashParams.color) state.colorBy = hashParams.color;
      if (hashParams.tltable) state.tlTable = true;
      if (hashParams.suntable) state.sunTable = true;
      if (hashParams.days) setDays(Number(hashParams.days));
      if (hashParams.tl) {
        const tl = await cached("/api/timeline", { path: state.root, days: state.days });
        state.tlAge = hashParams.tl === "max" ? [...tl.bars].sort((a, b) => b.newBytes - a.newBytes)[0].age : Number(hashParams.tl);
      }
    }
    await render();
    if (job.state === "done" && hashParams.open && hashParams.scrollto) document.getElementById("details-" + hashParams.scrollto)?.scrollIntoView({ block: "start" });
    if (job.state === "done" && hashParams.export) document.getElementById("export-btn").click();
  }

  function connectEvents() {
    if (STATIC) { STATIC.onEvent((e) => onJob(e.job, e.type === "progress")); return; }
    const es = new EventSource("/api/events?t=" + encodeURIComponent(TOKEN));
    es.addEventListener("job", (ev) => onJob(JSON.parse(ev.data), false));
    es.addEventListener("progress", (ev) => onJob(JSON.parse(ev.data), true));
  }

  let hbFails = 0;
  if (!STATIC) setInterval(() => {
    if (state.stopped) return;
    post("/api/heartbeat").then(() => (hbFails = 0), () => { if (++hbFails >= 2) { state.stopped = true; render(); } });
  }, 15000);
  if (!STATIC) post("/api/heartbeat").catch(() => {});
  if (!STATIC) window.addEventListener("pagehide", () => { navigator.sendBeacon("/api/bye?t=" + encodeURIComponent(TOKEN)); });

  // ---------- export ----------
  const dlg = document.getElementById("export-dialog");
  const fmtSeg = Array.from(document.querySelectorAll("#fmt-seg button"));
  const pathIn = document.getElementById("export-path");
  const msg = document.getElementById("export-msg");
  function setFmt(f) {
    state.fmt = f;
    fmtSeg.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.fmt === f)));
    const cur = pathIn.value.trim();
    if (!cur || cur === state.exportSuggestion.md || cur === state.exportSuggestion.html) pathIn.value = state.exportSuggestion[f];
    else pathIn.value = cur.replace(/\.(md|html)$/i, "." + f);
  }
  fmtSeg.forEach((b) => b.addEventListener("click", () => setFmt(b.dataset.fmt)));
  document.getElementById("export-btn").addEventListener("click", () => { msg.replaceChildren(); setFmt(state.fmt); dlg.showModal(); pathIn.focus(); pathIn.select(); });
  document.getElementById("export-cancel").addEventListener("click", () => dlg.close());
  document.getElementById("export-save").addEventListener("click", async () => {
    msg.replaceChildren(h("span", { class: "muted", text: "Saving..." }));
    if (STATIC) {
      // browser demo: build the report in the page and hand it to the browser as a download
      try {
        const text = await api("/api/report", { format: state.fmt, days: state.days });
        const name = (pathIn.value.trim().split(/[\\/]/).pop() || ("diskdelta-report." + state.fmt)).replace(/[^\w.-]/g, "_");
        const a = h("a", { download: name });
        a.href = URL.createObjectURL(new Blob([text], { type: state.fmt === "html" ? "text/html" : "text/markdown" }));
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        msg.replaceChildren(h("span", { class: "okmsg", text: "Downloaded " + name + "." }));
      } catch (e) { msg.replaceChildren(h("span", { class: "error", text: e.message })); }
      return;
    }
    try {
      const r = await post("/api/export", { format: state.fmt, path: pathIn.value.trim(), days: state.days });
      msg.replaceChildren(h("span", { class: "okmsg", text: "Saved " + r.path + " (" + fmtBytes(r.bytes) + ")." }));
    } catch (e) { msg.replaceChildren(h("span", { class: "error", text: e.message })); }
  });
  pathIn.addEventListener("keydown", (ev) => { if (ev.key === "Enter") document.getElementById("export-save").click(); });

  // ---------- start ----------
  // Optional URL fragment for links and screenshots: #scan=C:\,D:\&view=size&path=C:\Users&color=growth&days=7&export=1
  const hashParams = Object.fromEntries(new URLSearchParams((location.hash || "").slice(1)));
  let hashUsed = false;
  (async () => {
    try {
      const st = await api("/api/state");
      state.mode = st.mode; state.scans = st.scans; state.job = st.job; state.exportSuggestion = st.exportSuggestion;
      if (st.job && st.job.state !== "running") state.handledJobId = st.job.id;
      if (STATIC) {
        for (const k of ["md", "html"]) state.exportSuggestion[k] = state.exportSuggestion[k].split("\\").pop();
        document.querySelector("#export-path").previousElementSibling.textContent = "File name (your browser saves the download)";
        document.getElementById("export-save").textContent = "Download report";
      }
      document.getElementById("ver").textContent = "v" + st.version;
      document.getElementById("demo-badge").classList.toggle("hidden", st.mode !== "demo");
      if (st.mode === "demo") document.title = "DiskDelta (demo)";
      if (state.scans.length) setRoot(state.scans[state.scans.length - 1].root);
      connectEvents();
      await render();
      if (hashParams.scan) startScan(hashParams.scan.split(","));
    } catch (e) {
      view.replaceChildren(errorBox(e));
    }
  })();
})();
</script>
